<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#68416f">
  <title>MJ | Entradas e saídas</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root{--purple:#68416f;--pink:#d86b91;--paper:#f8f6f8;--white:#fff;--ink:#28202a;--muted:#716a73;--line:#e6dfe7;--green:#16835b;--red:#c43d4d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{width:min(310px,65vw);height:72px;object-fit:contain;object-position:left}.back{color:var(--purple);font-weight:700;text-decoration:none;white-space:nowrap}.wrap{max-width:1180px;margin:auto;padding:34px 22px 70px}h1{font-size:clamp(1.9rem,5vw,3rem);margin:0 0 8px;color:var(--purple)}.lead{color:var(--muted);margin:0 0 25px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.stat small{color:var(--muted);display:block;margin-bottom:7px}.stat strong{font-size:1.7rem}.stat.in strong{color:var(--green)}.stat.out strong{color:var(--red)}.tools{display:flex;gap:12px;margin-bottom:18px}.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px 16px;font:inherit;outline:none}.search:focus{border-color:var(--pink);box-shadow:0 0 0 3px #d86b9122}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(200px,1fr) 115px 230px;gap:16px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:700}.brand{color:var(--muted);font-size:.82rem;margin-top:4px}.balance{text-align:center}.balance strong{display:block;font-size:1.25rem}.balance small{color:var(--muted)}.actions{display:flex;gap:8px}.actions button{flex:1;border:0;border-radius:11px;padding:11px 8px;color:#fff;font-weight:700;cursor:pointer}.entry{background:var(--green)}.exit{background:var(--red)}.empty{text-align:center;padding:42px;color:var(--muted)}dialog{border:0;border-radius:20px;padding:0;width:min(430px,calc(100% - 28px));box-shadow:0 24px 70px #281c2a55}dialog::backdrop{background:#281c2a88}.modal{padding:24px}.modal h2{margin:0 0 5px;color:var(--purple)}.modal p{color:var(--muted);margin:0 0 18px}.modal label{display:block;font-weight:700;margin:12px 0 6px}.modal input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}.modalBtns{display:flex;gap:10px;margin-top:20px}.modalBtns button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:700;cursor:pointer}.cancel{background:#eee8ef;color:var(--purple)}.confirm{color:#fff}.history{margin-top:22px}.history h2{color:var(--purple)}.movement{display:grid;grid-template-columns:110px 1fr 90px;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:center}.movement:last-child{border:0}.movement time{font-size:.82rem;color:var(--muted)}.movement .qty{text-align:right;font-weight:800}.movement.entry-m .qty{color:var(--green)}.movement.exit-m .qty{color:var(--red)}@media(max-width:720px){.topin,.wrap{padding-left:15px;padding-right:15px}.logo{height:58px}.back{font-size:.82rem}.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr 75px}.actions{grid-column:1/-1}.movement{grid-template-columns:82px 1fr 55px}.panel{border-radius:15px}}
  </style>
</head>
<body>
  <header class="top"><div class="topin"><img class="logo" src="assets/logo-mj.png" alt="MJ Distribuidora"><a class="back" href="index.html">← Voltar ao catálogo</a></div></header>
  <main class="wrap">
    <h1>Entradas e saídas</h1>
    <p class="lead">Registre os movimentos dos produtos. O saldo começa em zero e corresponde às entradas menos as saídas lançadas neste aparelho.</p>
    <section class="summary"><div class="stat in"><small>Total de entradas</small><strong id="entries">0</strong></div><div class="stat out"><small>Total de saídas</small><strong id="exits">0</strong></div><div class="stat"><small>Saldo dos movimentos</small><strong id="net">0</strong></div></section>
    <div class="tools"><input id="search" class="search" type="search" placeholder="Buscar produto ou marca…" aria-label="Buscar produto"></div>
    <section id="list" class="panel" aria-label="Produtos"></section>
    <section class="history"><h2>Últimos movimentos</h2><div id="history" class="panel"></div></section>
  </main>
  <dialog id="movementDialog"><form id="movementForm" class="modal" method="dialog"><h2 id="dialogTitle">Registrar entrada</h2><p id="dialogProduct"></p><label for="quantity">Quantidade</label><input id="quantity" type="number" min="1" step="1" value="1" required><label for="note">Observação (opcional)</label><input id="note" type="text" maxlength="80" placeholder="Ex.: reposição ou venda do evento"><div class="modalBtns"><button class="cancel" type="button" onclick="closeDialog()">Cancelar</button><button id="confirmBtn" class="confirm entry" type="submit">Confirmar</button></div></form></dialog>
  <script src="products.js"></script>
  <script>
    const KEY="mj-stock-movements-v1";let query="",selected=null,kind="entry";
    const esc=s=>String(s||"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}};
    const write=data=>localStorage.setItem(KEY,JSON.stringify(data));
    function balances(){const b={};for(const m of read())b[m.productId]=(b[m.productId]||0)+(m.kind==="entry"?m.quantity:-m.quantity);return b}
    function render(){const moves=read(),b=balances(),q=norm(query.trim()),filtered=products.filter(p=>!q||norm(`${p.name} ${p.brand}`).includes(q));document.getElementById("entries").textContent=moves.filter(m=>m.kind==="entry").reduce((s,m)=>s+m.quantity,0);document.getElementById("exits").textContent=moves.filter(m=>m.kind==="exit").reduce((s,m)=>s+m.quantity,0);document.getElementById("net").textContent=moves.reduce((s,m)=>s+(m.kind==="entry"?m.quantity:-m.quantity),0);document.getElementById("list").innerHTML=filtered.length?filtered.map(p=>`<div class="row"><div><div class="name">${esc(p.name)}</div><div class="brand">${esc(p.brand||"MJ")}</div></div><div class="balance"><strong>${b[p.id]||0}</strong><small>saldo</small></div><div class="actions"><button class="entry" onclick="openDialog(${p.id},'entry')">+ Entrada</button><button class="exit" onclick="openDialog(${p.id},'exit')">− Saída</button></div></div>`).join(""):`<div class="empty">Nenhum produto encontrado.</div>`;document.getElementById("history").innerHTML=moves.length?moves.slice().reverse().slice(0,30).map(m=>{const p=products.find(x=>x.id===m.productId);return `<div class="movement ${m.kind}-m"><time>${new Date(m.date).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</time><div><strong>${esc(p?.name||"Produto")}</strong>${m.note?`<div class="brand">${esc(m.note)}</div>`:""}</div><div class="qty">${m.kind==="entry"?"+":"−"}${m.quantity}</div></div>`}).join(""):`<div class="empty">Nenhuma entrada ou saída registrada.</div>`}
    function openDialog(id,type){selected=id;kind=type;const p=products.find(x=>x.id===id);document.getElementById("dialogTitle").textContent=type==="entry"?"Registrar entrada":"Registrar saída";document.getElementById("dialogProduct").textContent=p.name;document.getElementById("confirmBtn").className=`confirm ${type}`;document.getElementById("quantity").value=1;document.getElementById("note").value="";document.getElementById("movementDialog").showModal();setTimeout(()=>document.getElementById("quantity").select(),50)}
    function closeDialog(){document.getElementById("movementDialog").close()}
    document.getElementById("movementForm").addEventListener("submit",e=>{e.preventDefault();const quantity=Number(document.getElementById("quantity").value);if(!Number.isInteger(quantity)||quantity<1)return;const data=read();data.push({productId:selected,kind,quantity,note:document.getElementById("note").value.trim(),date:new Date().toISOString()});write(data);closeDialog();render()});document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render()});render();
  </script>
</body>
</html>

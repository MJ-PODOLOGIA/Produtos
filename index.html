<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <title>MJ | Catálogo do evento</title>
  <meta name="description" content="Escolha seus produtos MJ e envie o pedido pelo WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <style>
    :root{--ink:#101828;--muted:#667085;--line:#e4e7ec;--paper:#f8fafc;--white:#fff;--brand:#fdb022;--brand2:#f79009;--green:#12b76a;--shadow:0 18px 50px rgba(16,24,40,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;font-size:16px}.top{background:var(--ink);color:#fff}.top-inner{max-width:1180px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;font-family:Manrope,sans-serif;font-weight:800;font-size:1.4rem}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--brand);color:var(--ink);font-size:1.15rem;box-shadow:inset 0 -4px rgba(0,0,0,.08)}.event{font-size:.9rem;color:#d0d5dd;text-align:right}.intro{max-width:1180px;margin:auto;padding:36px 22px 24px;display:flex;justify-content:space-between;align-items:end;gap:30px}.eyebrow{color:#b54708;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem}.intro h1{font-family:Manrope,sans-serif;font-size:clamp(2rem,5vw,3.5rem);line-height:1.04;margin:8px 0 10px;max-width:720px;letter-spacing:-.04em}.intro p{color:var(--muted);margin:0;line-height:1.6}.count-pill{white-space:nowrap;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:999px;color:var(--muted);font-weight:600}.layout{max-width:1180px;margin:auto;padding:10px 22px 80px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:26px;align-items:start}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.2s ease;box-shadow:0 2px 5px rgba(16,24,40,.03)}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.photo{aspect-ratio:16/10;position:relative;display:grid;place-items:center;background:linear-gradient(135deg,#fff7e6,#fedf89);overflow:hidden}.photo::before,.photo::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.65)}.photo::before{width:180px;height:180px;right:-55px;top:-80px}.photo::after{width:90px;height:90px;left:-25px;bottom:-34px}.product-mark{font-family:Manrope,sans-serif;font-size:2.4rem;font-weight:800;color:#93370d;z-index:1}.sample{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.86);padding:6px 9px;border-radius:8px;font-size:.72rem;font-weight:700;color:#b54708;z-index:2}.body{padding:18px}.body h2{font-family:Manrope,sans-serif;font-size:1.14rem;margin:0 0 7px}.desc{color:var(--muted);font-size:.9rem;line-height:1.45;min-height:42px;margin:0 0 16px}.price-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.price{font-family:Manrope,sans-serif;font-size:1.3rem;font-weight:800}.stepper{display:flex;align-items:center;background:#f2f4f7;border-radius:12px;padding:4px}.stepper button{border:0;background:#fff;width:34px;height:34px;border-radius:9px;color:var(--ink);font-size:1.25rem;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.08)}.stepper button:active{transform:scale(.94)}.qty{min-width:34px;text-align:center;font-weight:700}.cart{position:sticky;top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:21px;box-shadow:var(--shadow)}.cart-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px}.cart h2{font-family:Manrope,sans-serif;font-size:1.25rem;margin:0}.badge{background:#fff4e5;color:#b54708;font-weight:700;padding:5px 9px;border-radius:999px;font-size:.82rem}.empty{text-align:center;color:var(--muted);padding:34px 12px}.empty-icon{font-size:2rem;margin-bottom:8px}.cart-items{display:grid;gap:13px;margin:17px 0}.cart-item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.9rem}.cart-item strong{font-weight:600}.cart-item span{color:var(--muted)}.cart-item .subtotal{grid-row:1/3;grid-column:2;align-self:center;color:var(--ink);font-weight:700}.total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:17px;margin-top:10px}.total strong{font-family:Manrope,sans-serif;font-size:1.55rem}.buy{width:100%;margin-top:17px;border:0;border-radius:14px;padding:15px 16px;background:var(--green);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(18,183,106,.24)}.buy:hover{filter:brightness(.95)}.buy:disabled{background:#98a2b3;box-shadow:none;cursor:not-allowed}.secure{text-align:center;color:var(--muted);font-size:.78rem;margin:11px 0 0}.floating{display:none}.footer{background:var(--ink);color:#98a2b3;text-align:center;padding:22px;font-size:.85rem}@media(max-width:900px){.layout{grid-template-columns:1fr;padding-bottom:110px}.cart{position:static}.intro{align-items:start;flex-direction:column}.count-pill{display:none}}@media(max-width:600px){.top-inner{padding:13px 16px}.event{font-size:.78rem}.intro{padding:28px 16px 18px}.layout{padding:8px 16px 120px}.products{grid-template-columns:1fr}.card{border-radius:18px}.photo{aspect-ratio:2/1}.desktop-cart{display:none}.floating{display:flex;position:fixed;bottom:14px;left:14px;right:14px;z-index:10;background:var(--ink);color:#fff;border:0;border-radius:16px;padding:14px 16px;align-items:center;justify-content:space-between;box-shadow:0 14px 30px rgba(16,24,40,.35);font:inherit;cursor:pointer}.floating small{display:block;color:#d0d5dd;text-align:left}.floating strong{font-size:1.05rem}.drawer-wrap{position:fixed;inset:0;background:rgba(16,24,40,.48);z-index:20;padding:18px;display:none;align-items:end}.drawer-wrap.open{display:flex}.drawer{background:#fff;border-radius:24px 24px 18px 18px;padding:22px;width:100%;max-height:82vh;overflow:auto}.drawer-close{border:0;background:#f2f4f7;width:36px;height:36px;border-radius:50%;font-size:1.2rem;cursor:pointer}.drawer .cart-head{padding-bottom:12px}}
    .catalog-tools{max-width:1180px;margin:0 auto;padding:0 22px 18px}.search-box{position:relative;max-width:690px}.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}.search{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:14px 16px 14px 48px;font:inherit;color:var(--ink);outline:none;box-shadow:0 2px 5px rgba(16,24,40,.03)}.search:focus{border-color:var(--brand2);box-shadow:0 0 0 4px rgba(247,144,9,.13)}.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:10px;z-index:1}.brand-name{color:#b54708;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}.customer{margin:17px 0}.customer label{display:block;font-size:.86rem;font-weight:700;margin-bottom:7px}.customer input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;outline:none}.customer input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(247,144,9,.13)}.no-results{grid-column:1/-1;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:42px 20px;color:var(--muted)}.load-more{grid-column:1/-1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}.load-more:hover{border-color:var(--brand2)}@media(max-width:600px){.catalog-tools{padding:0 16px 14px}.search{padding-top:13px;padding-bottom:13px}}
    .top{background:#fff;color:#68416f;border-bottom:1px solid var(--line)}.top-inner{padding:10px 22px}.brand-logo{display:block;width:min(340px,68vw);height:82px;object-fit:contain;object-position:left center}.event{color:#68416f;font-weight:700}@media(max-width:600px){.top-inner{padding:8px 16px}.brand-logo{height:68px}.event{max-width:95px}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><img class="brand-logo" src="assets/logo-mj.png" alt="MJ Distribuidora de Produtos Podológicos"><div class="event">Catálogo especial do evento</div></div></header>
  <section class="intro"><div><div class="eyebrow">Tabela especial · Congresso 2026</div><h1>Produtos selecionados para você.</h1><p>Encontre o produto, ajuste a quantidade e envie seu pedido diretamente para nossa equipe.</p></div><div class="count-pill"><span id="productsCount">248</span> produtos disponíveis</div></section>
  <section class="catalog-tools"><div class="search-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input class="search" id="search" type="search" placeholder="Buscar por produto ou marca…" aria-label="Buscar produtos"></div></section>
  <main class="layout"><section class="products" id="products" aria-label="Produtos"></section><aside class="cart desktop-cart" aria-label="Carrinho"><div id="cartDesktop"></div></aside></main>
  <button class="floating" id="floatingCart" aria-label="Abrir carrinho"><span><small id="floatingCount">Carrinho vazio</small><strong>Ver meu pedido</strong></span><strong id="floatingTotal">R$ 0,00</strong></button>
  <div class="drawer-wrap" id="drawerWrap" role="dialog" aria-modal="true" aria-label="Seu pedido"><div class="drawer"><div id="cartMobile"></div></div></div>
  <footer class="footer">MJ Distribuidora · Atendimento pelo WhatsApp<br><a href="dashboard.html" style="display:inline-block;margin-top:8px;color:#fedf89">Controle de entradas e saídas</a></footer>
  <script src="products.js"></script>
  <script>
    const quantities=Object.fromEntries(products.map(p=>[p.id,0]));
    const money=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    const escapeHtml=s=>s.replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    let query="",visibleLimit=24,customerName="";
    const normalize=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    function filteredProducts(){const q=normalize(query.trim());return q?products.filter(p=>normalize(`${p.name} ${p.brand}`).includes(q)):products}
    function renderProducts(){const filtered=filteredProducts(),shown=filtered.slice(0,visibleLimit);document.getElementById("products").innerHTML=shown.length?shown.map(p=>`<article class="card"><div class="photo">${p.image?`<img src="${encodeURI(p.image)}" alt="${escapeHtml(p.name)}" loading="lazy" decoding="async">`:`<span class="product-mark">MJ</span>`}</div><div class="body"><p class="brand-name">${escapeHtml(p.brand||"MJ")}</p><h2>${escapeHtml(p.name)}</h2><div class="price-row"><span class="price">${money(p.price)}</span><div class="stepper" aria-label="Quantidade de ${escapeHtml(p.name)}"><button onclick="changeQty(${p.id},-1)" aria-label="Diminuir">−</button><span class="qty" id="qty-${p.id}" aria-live="polite">${quantities[p.id]}</span><button onclick="changeQty(${p.id},1)" aria-label="Aumentar">+</button></div></div></div></article>`).join("")+(filtered.length>shown.length?`<button class="load-more" onclick="showMore()">Mostrar mais produtos (${filtered.length-shown.length} restantes)</button>`:""):`<div class="no-results"><strong>Nenhum produto encontrado.</strong><br>Tente buscar usando outra palavra.</div>`}
    function showMore(){visibleLimit+=24;renderProducts()}
    function changeQty(id,delta){quantities[id]=Math.max(0,Math.min(99,quantities[id]+delta));document.getElementById(`qty-${id}`).textContent=quantities[id];renderCart()}
    function cartData(){const items=products.filter(p=>quantities[p.id]>0);return{items,count:items.reduce((s,p)=>s+quantities[p.id],0),total:items.reduce((s,p)=>s+p.price*quantities[p.id],0)}}
    function cartMarkup(mobile=false){const {items,count,total}=cartData();return `<div class="cart-head"><h2>Seu pedido</h2>${mobile?'<button class="drawer-close" onclick="closeCart()" aria-label="Fechar">×</button>':`<span class="badge">${count} ${count===1?"item":"itens"}</span>`}</div><div class="customer"><label for="customer-${mobile?'mobile':'desktop'}">Nome do cliente</label><input id="customer-${mobile?'mobile':'desktop'}" type="text" value="${escapeHtml(customerName)}" placeholder="Digite seu nome completo" autocomplete="name" oninput="setCustomerName(this.value)" required></div>${items.length?`<div class="cart-items">${items.map(p=>`<div class="cart-item"><strong>${escapeHtml(p.name)}</strong><span>${quantities[p.id]} × ${money(p.price)}</span><span class="subtotal">${money(p.price*quantities[p.id])}</span></div>`).join("")}</div><div class="total"><span>Total</span><strong>${money(total)}</strong></div>`:`<div class="empty"><div class="empty-icon">🛒</div><strong>Seu carrinho está vazio</strong><br><span>Adicione produtos usando o botão +.</span></div>`}<button class="buy" onclick="buyNow()" ${items.length?"":"disabled"}>Comprar agora pelo WhatsApp</button><p class="secure">Você revisará a mensagem antes de enviar.</p>`}
    function setCustomerName(value){customerName=value;document.querySelectorAll('.customer input').forEach(input=>{if(input.value!==value)input.value=value})}
    function renderCart(){const {count,total}=cartData();document.getElementById("cartDesktop").innerHTML=cartMarkup();document.getElementById("cartMobile").innerHTML=cartMarkup(true);document.getElementById("floatingCount").textContent=count?`${count} ${count===1?"item selecionado":"itens selecionados"}`:"Carrinho vazio";document.getElementById("floatingTotal").textContent=money(total)}
    function buyNow(){const {items,total}=cartData();if(!items.length)return;if(!customerName.trim()){alert("Por favor, informe o nome do cliente.");const visibleInput=[...document.querySelectorAll('.customer input')].find(input=>input.offsetParent!==null);visibleInput?.focus();return}const lines=[`*NOME DO CLIENTE: ${customerName.trim()}*`,"","Olá! Gostaria de fazer o seguinte pedido:","",...items.flatMap((p,i)=>[`${i+1}. *${p.name}*`,`Quantidade: ${quantities[p.id]}`,`Valor unitário: ${money(p.price)}`,`Subtotal: ${money(p.price*quantities[p.id])}`,""]),`*VALOR TOTAL: ${money(total)}*`,"","Aguardo a confirmação. Obrigado!"];window.open(`https://wa.me/5561998417189?text=${encodeURIComponent(lines.join("\n"))}`,"_blank","noopener")}
    function openCart(){document.getElementById("drawerWrap").classList.add("open");document.body.style.overflow="hidden"}
    function closeCart(){document.getElementById("drawerWrap").classList.remove("open");document.body.style.overflow=""}
    document.getElementById("floatingCart").addEventListener("click",openCart);document.getElementById("drawerWrap").addEventListener("click",e=>{if(e.target.id==="drawerWrap")closeCart()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});document.getElementById("search").addEventListener("input",e=>{query=e.target.value;visibleLimit=24;renderProducts()});document.getElementById("productsCount").textContent=products.length;renderProducts();renderCart();
  </script>
</body>
</html>
